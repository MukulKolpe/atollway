name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn next:lint --max-warnings=0

      - name: Type-check
        run: yarn next:check-types

      - name: Build
        run: yarn next:build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn foundry:lint

      # Only project contracts are size-checked: test helpers in lib/ are never deployed.
      - name: Build and check contract sizes
        working-directory: packages/foundry
        run: forge build contracts --sizes

      - name: Test
        working-directory: packages/foundry
        run: forge test -vvv
