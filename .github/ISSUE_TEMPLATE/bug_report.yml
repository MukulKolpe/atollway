name: Bug report
description: Something in Atollway does not work as documented.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. **Never paste private keys, seed phrases, API keys or `.env` contents.** Redact them before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, short description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm create scaffold-hbar@latest --template MukulKolpe/atollway
        2. yarn ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hub contracts (Hedera)
        - Spoke contracts (other chains)
        - Transports (Axelar / Chainlink CCIP)
        - Frontend (Next.js)
        - Scripts and deployment
        - Scaffolding (template.json)
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Local
        - Hedera testnet
        - Hedera mainnet
        - Not applicable
    validations:
      required: true
  - type: input
    id: chains
    attributes:
      label: Spoke chains involved
      placeholder: e.g. base-sepolia, robinhood-testnet
  - type: input
    id: transactions
    attributes:
      label: Transaction links
      description: HashScan, block explorer, Axelarscan or CCIP Explorer links, if any.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `node -v`, `forge --version`, your package manager and version, OS and wallet.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs with secrets removed. They are formatted as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed private keys, seed phrases and API keys from everything above.
          required: true
