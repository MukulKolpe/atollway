name: Documentation
description: Report missing, unclear or incorrect documentation.
title: "docs: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Where?
      description: File, page or section.
      placeholder: e.g. README.md#quickstart
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Missing
        - Unclear
        - Incorrect or out of date
        - Typo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
